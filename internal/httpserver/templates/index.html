{{define "index.html"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CronWatch</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div>
      <h1>CronWatch</h1>
      <p>Local web UI for scheduled jobs</p>
    </div>
    <span class="local-badge">LOCAL</span>
  </header>

  <nav class="tabs">
    <a class="active" href="/">Jobs</a>
    <a href="/runs">Runs</a>
  </nav>

  <section class="panel">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Job</th>
            <th>Status</th>
            <th>Last Run</th>
            <th>Duration</th>
            <th>Next Expected</th>
          </tr>
        </thead>
        {{template "jobs_rows" .}}
      </table>
    </div>
  </section>
</main>
<script src="/static/app.js" defer></script>
</body>
</html>
{{end}}
